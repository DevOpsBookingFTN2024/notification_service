spring.application.name=notification_service

spring.data.mongodb.uri=mongodb://localhost:27017/notification_db
spring.data.mongodb.database=notification_db

user.service.url=http://user-service:8081

server.port=8085

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.tags.application=notification-service
management.server.port=8085
otel.exporter.otlp.endpoint=http://jaeger-collector.monitoring.svc.cluster.local:4317
management.tracing.sampling.probability=1.0

loki.url=http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
logging.level.root=INFO
logging.level.org.springframework.web=INFO