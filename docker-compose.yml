networks:
  booking-network:
    external: true

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - booking-network

  notification-service:
    build: .
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/notification_db
      SPRING_DATA_MONGODB_DATABASE: notification_db
    ports:
      - "8085:8085"
    depends_on:
      - mongodb
    restart: on-failure
    networks:
      - booking-network

volumes:
  mongodb-data:
